<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>دليل الأقسام والأرشيف</title>

  <!-- خط Cairo & Tajawal من Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=Tajawal:wght@500;700;800&display=swap" rel="stylesheet" />

  <!-- مكتبة Telegram Web App الرسمية -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    :root {
      --tile-bg: linear-gradient(145deg, rgba(112, 134, 194, 0.94), rgba(78, 97, 150, 0.94));
      --tile-bg-hover: linear-gradient(145deg, rgba(128, 151, 214, 0.98), rgba(92, 113, 170, 0.98));
      --tile-text: #0f172a;
      --footer-bg: rgba(15, 23, 36, 0.88);
      --footer-text: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: 'Cairo', 'Tajawal', sans-serif;
      background-color: #03050c;
      color: #ffffff;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
      padding-bottom: 70px;
    }

    /* خلفية المجرة والنجوم والشهب المتحركة */
    #stars-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
      background: radial-gradient(ellipse at 50% 20%, #0d1530 0%, #060919 55%, #020308 100%);
    }

    /* هالة ضوئية ناعمة خلف العمود لإبراز المربعات بأناقة */
    body::before {
      content: "";
      position: fixed;
      top: 15%;
      left: 50%;
      transform: translateX(-50%);
      width: 280px;
      height: 70vh;
      background: radial-gradient(circle, rgba(99, 125, 205, 0.14) 0%, rgba(139, 92, 246, 0.06) 45%, transparent 75%);
      filter: blur(35px);
      z-index: 0;
      pointer-events: none;
    }

    /* أزرار التحكم العلوية (تبديل الخلفية وتبديل ترتيب الأزرار) */
    .bg-style-btn,
    .layout-style-btn {
      position: fixed;
      top: 10px;
      z-index: 25;
      background: rgba(15, 23, 42, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #f8fafc;
      padding: 5px 10px;
      border-radius: 999px;
      font-family: inherit;
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      gap: 4px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5);
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .bg-style-btn {
      left: 10px;
    }

    .layout-style-btn {
      right: 10px;
    }

    .bg-style-btn:active,
    .layout-style-btn:active {
      transform: scale(0.92);
    }

    /* المحتوى الرئيسي فوق الخلفية */
    .main-wrapper {
      position: relative;
      z-index: 1;
      max-width: 480px;
      margin: 0 auto;
      padding: 52px 16px 50px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ترحيب وحقل بحث وشريط فلترة اختياري */
    .top-bar {
      width: 100%;
      text-align: center;
      margin-bottom: 18px;
    }

    .greeting-text {
      font-size: 0.95rem;
      color: #cbd5e1;
      margin-bottom: 10px;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.8);
    }

    .search-box {
      width: 100%;
      max-width: 280px;
      margin: 0 auto 12px;
      position: relative;
    }

    .search-input {
      width: 100%;
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.3);
      background: rgba(23, 33, 43, 0.75);
      color: #ffffff;
      font-family: inherit;
      font-size: 0.84rem;
      text-align: center;
      outline: none;
      backdrop-filter: blur(6px);
      transition: border-color 0.2s;
    }

    .search-input::placeholder {
      color: #94a3b8;
    }

    .search-input:focus {
      border-color: #93a8df;
    }

    /* شريط التصنيفات السريع */
    .filter-chips {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 6px;
    }

    .chip {
      background: rgba(97, 116, 166, 0.28);
      border: 1px solid rgba(148, 163, 184, 0.3);
      color: #e2e8f0;
      padding: 4px 12px;
      border-radius: 999px;
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      backdrop-filter: blur(4px);
      transition: all 0.2s ease;
    }

    .chip.active {
      background: var(--tile-bg);
      color: #ffffff;
      border-color: #93a8df;
      box-shadow: 0 0 12px rgba(97, 116, 166, 0.6);
    }

    /* 1. الترتيب الكلاسيكي: عمود واحد في المنتصف */
    .sections-column {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      width: 100%;
      padding-top: 10px;
    }

    /* 2. الترتيب الشبكي المزدوج (زر رئيسي بارز في الأعلى + زرّان في كل صف) */
    .sections-column.layout-grid-2 {
      display: grid;
      grid-template-columns: repeat(2, 136px);
      justify-content: center;
      gap: 16px;
    }

    .sections-column.layout-grid-2 .section-tile {
      width: 136px;
      min-height: 122px;
    }

    .sections-column.layout-grid-2 .section-tile:first-child {
      grid-column: 1 / -1;
      width: 100%;
      min-height: 112px;
      background: linear-gradient(135deg, rgba(124, 148, 216, 0.96), rgba(86, 107, 172, 0.96));
    }

    /* 3. الترتيب المتعرج الأنيق (يمين - يسار بالتناوب) */
    .sections-column.layout-zigzag {
      gap: 16px;
      max-width: 290px;
    }

    .sections-column.layout-zigzag .section-tile:nth-child(odd) {
      align-self: flex-end;
    }

    .sections-column.layout-zigzag .section-tile:nth-child(even) {
      align-self: flex-start;
    }

    /* 4. ترتيب البطاقات العريضة الفاخرة (أيقونة يمين + نص وسط + سهم يسار) */
    .sections-column.layout-cards {
      gap: 12px;
      max-width: 340px;
    }

    .sections-column.layout-cards .section-tile,
    .sections-column.layout-hybrid .section-tile.wide-card-tile {
      width: 100%;
      min-height: 74px;
      flex-direction: row;
      justify-content: flex-start;
      padding: 12px 18px;
      gap: 14px;
      border-radius: 18px;
    }

    .sections-column.layout-cards .book-icon,
    .sections-column.layout-hybrid .section-tile.wide-card-tile .book-icon {
      width: 48px;
      height: 38px;
      margin-bottom: 0;
      flex-shrink: 0;
    }

    .sections-column.layout-cards .tile-text-wrap,
    .sections-column.layout-hybrid .section-tile.wide-card-tile .tile-text-wrap {
      display: flex;
      flex-direction: row;
      align-items: baseline;
      gap: 6px;
      flex: 1;
      text-align: right;
    }

    .sections-column.layout-cards .tile-arrow,
    .sections-column.layout-hybrid .section-tile.wide-card-tile .tile-arrow {
      display: inline-flex;
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--tile-text);
      opacity: 0.65;
    }

    /* 5. الترتيب المدمج الذكي (يجمع الشبكة المزدوجة للأرشيف + البطاقات العريضة للأقسام) */
    .sections-column.layout-hybrid {
      display: grid;
      grid-template-columns: repeat(2, 140px);
      justify-content: center;
      gap: 14px;
    }

    .sections-column.layout-hybrid .section-tile {
      width: 140px;
      min-height: 120px;
    }

    .sections-column.layout-hybrid .section-tile.wide-card-tile {
      grid-column: 1 / -1;
      background: linear-gradient(135deg, rgba(120, 144, 210, 0.96), rgba(82, 102, 165, 0.96));
    }

    .tile-text-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .tile-arrow {
      display: none;
    }

    /* تصميم المربع (القسم) بلمسة زجاجية فاخرة */
    .section-tile {
      width: 128px;
      min-height: 122px;
      background: var(--tile-bg);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 14px 10px 12px;
      text-decoration: none;
      cursor: pointer;
      backdrop-filter: blur(8px);
      box-shadow:
        0 10px 25px rgba(0, 0, 0, 0.65),
        0 0 18px rgba(97, 116, 166, 0.25),
        inset 0 1px 1px rgba(255, 255, 255, 0.35);
      transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1), background 0.2s ease, box-shadow 0.2s ease;
      animation: tileFadeIn 0.28s ease forwards;
    }

    @keyframes tileFadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .section-tile:hover {
      background: var(--tile-bg-hover);
      box-shadow:
        0 12px 28px rgba(0, 0, 0, 0.75),
        0 0 24px rgba(129, 154, 224, 0.45),
        inset 0 1px 2px rgba(255, 255, 255, 0.45);
      transform: translateY(-2px);
    }

    .section-tile:active {
      transform: scale(0.93);
    }

    /* أيقونة الكتاب المائل ثلاثي الأبعاد */
    .book-icon {
      width: 56px;
      height: 44px;
      margin-bottom: 6px;
      filter: drop-shadow(0 3px 4px rgba(0, 0, 0, 0.35));
    }

    .tile-title {
      font-size: 1.02rem;
      font-weight: 800;
      color: var(--tile-text);
      text-align: center;
      line-height: 1.2;
    }

    .tile-subtitle {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--tile-text);
      text-align: center;
      line-height: 1.15;
      margin-top: 2px;
    }

    .empty-msg {
      color: #94a3b8;
      font-size: 0.9rem;
      margin-top: 20px;
      text-align: center;
    }

    /* زر الصعود للأعلى العائم (نفس شكل الصورة) */
    .scroll-top-btn {
      position: fixed;
      bottom: 54px;
      left: 50%;
      transform: translateX(-20px) scale(0.9);
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background-color: #050507;
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10;
      opacity: 0;
      pointer-events: none;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.8);
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .scroll-top-btn.visible {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(-20px) scale(1);
    }

    .scroll-top-btn:active {
      transform: translateX(-20px) scale(0.92);
    }

    /* الشريط السفلي الثابت لمعرف البوت */
    .bot-footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 40px;
      background-color: var(--footer-bg);
      color: var(--footer-text);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.92rem;
      font-family: sans-serif;
      letter-spacing: 0.3px;
      z-index: 10;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      cursor: pointer;
    }

    /* =========================================================================
       تنسيق قسم التبرع المدمج الذكي (Compact Tabs)
       ========================================================================= */
    .donation-container {
      width: 100%;
      max-width: 320px;
      margin: 22px auto 12px;
      padding: 12px 14px;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(253, 230, 138, 0.25);
      border-radius: 16px;
      text-align: center;
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.45);
    }

    .donation-container h3 {
      font-size: 0.92rem;
      color: #fde047;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      
      gap: 5px;
    }

    /* أزرار اختيار العملة (Tabs أفقية صغيرة) */
    .crypto-tabs {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-bottom: 10px;
    }

    .crypto-tab-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: #cbd5e1;
      padding: 4px 10px;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.74rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .crypto-tab-btn.active {
      background: #fde047;
      color: #0f172a;
      border-color: #fde047;
      box-shadow: 0 0 10px rgba(253, 224, 71, 0.4);
    }

    /* صندوق عرض المحفظة النشطة فقط */
    .donation-address-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 7px 10px;
      border-radius: 10px;
      margin-bottom: 8px;
    }

    .donation-address {
      font-family: monospace;
      font-size: 0.74rem;
      color: #93c5fd;
      word-break: break-all;
      text-align: left;
      direction: ltr;
      user-select: all;
    }

    .copy-btn {
      background: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 5px 10px;
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 0.2s;
    }

    .copy-btn:active {
      opacity: 0.7;
    }

    /* شريط التنبيهات والأخبار المتحرك الأنيق */
    .announcement-bar {
      width: 100%;
      max-width: 360px;
      margin: 0 auto 12px;
      padding: 6px 12px;
      background: rgba(15, 23, 42, 0.78);
      border: 1px solid rgba(253, 230, 138, 0.28);
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 8px;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
      overflow: hidden;
      box-sizing: border-box;
    }

    .announcement-badge {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #0f172a;
      font-size: 0.72rem;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 999px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .announcement-ticker {
      flex: 1;
      overflow: hidden;
      white-space: nowrap;
      position: relative;
    }

    .announcement-text {
      display: inline-block;
      font-size: 0.8rem;
      color: #e2e8f0;
      font-weight: 600;
      animation: tickerAnimation 16s linear infinite;
    }

    .announcement-bar:hover .announcement-text {
      animation-play-state: paused;
    }

    @keyframes tickerAnimation {
      0% {
        transform: translateX(-100%);
      }
      100% {
        transform: translateX(100%);
      }
    }

    /* =========================================================================
       2. زر ونجمة المفضلة والشارات المميزة (Badges & Favorites)
       ========================================================================= */
    .fav-star-btn {
      position: absolute;
      top: 6px;
      left: 6px;
      background: rgba(0, 0, 0, 0.28);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: rgba(255, 255, 255, 0.45);
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.82rem;
      cursor: pointer;
      z-index: 5;
      transition: all 0.2s ease;
    }

    .fav-star-btn:hover {
      transform: scale(1.15);
      color: #fde047;
    }

    .fav-star-btn.is-fav {
      color: #fde047;
      background: rgba(253, 224, 71, 0.2);
      border-color: #fde047;
      text-shadow: 0 0 8px #fde047;
    }

    /* شارات الأقسام (جديد / حصري / مثبت) */
    .section-badge {
      position: absolute;
      top: 8px;
      right: 8px;
      font-size: 0.68rem;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 999px;
      letter-spacing: 0.2px;
      z-index: 4;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
    }

    .badge-new {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #ffffff;
      border: 1px solid rgba(167, 243, 208, 0.5);
    }

    .badge-hot {
      background: linear-gradient(135deg, #ef4444, #b91c1c);
      color: #ffffff;
      border: 1px solid rgba(254, 202, 202, 0.5);
    }

    .badge-pinned {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #0f172a;
      border: 1px solid rgba(253, 230, 138, 0.6);
    }

    /* زر إخفاء وإظهار شريط البحث والتصنيفات (وضع ملء الشاشة النظيف) */
    .toggle-header-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #cbd5e1;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 999px;
      cursor: pointer;
      margin: 0 auto 10px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s ease;
    }

    .toggle-header-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #ffffff;
    }

    /* شاشة البداية والتحميل الفاخرة (Splash Screen) */
    #splash-screen {
      position: fixed;
      inset: 0;
      background: #03050c;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    #splash-screen.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .splash-logo-circle {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: linear-gradient(135deg, #6366f1, #3b82f6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      box-shadow: 0 0 25px rgba(99, 102, 241, 0.6);
      animation: splashPulse 1.4s ease-in-out infinite;
    }

    @keyframes splashPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); box-shadow: 0 0 35px rgba(129, 140, 248, 0.8); }
    }

    .splash-title {
      font-size: 1.15rem;
      font-weight: 800;
      color: #f8fafc;
      letter-spacing: 0.5px;
    }

    .splash-spinner {
      width: 24px;
      height: 24px;
      border: 2px solid rgba(255, 255, 255, 0.15);
      border-top-color: #fde047;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .section-tile {
      position: relative;
    }
  </style>
</head>
<body>

  <!-- شاشة التحميل الافتتاحية السريعة والفاخرة (Splash Screen) -->
  <div id="splash-screen">
    <div class="splash-logo-circle">📚</div>
    <div class="splash-title">دليل الأقسام والأرشيف</div>
    <div class="splash-spinner"></div>
  </div>

  <!-- خلفية المجرة والنجوم والشهب -->
  <canvas id="stars-canvas"></canvas>

  <!-- زر أنيق لتغيير ثيم الخلفية بضغطة واحدة -->
  <button id="bg-style-btn" class="bg-style-btn" type="button" title="تغيير شكل الخلفية">
    <span>✨</span>
    <span id="bg-style-label">المجرة الملكية</span>
  </button>

  <!-- زر أنيق لتبديل ترتيب الأزرار بين 4 أشكال -->
  <button id="layout-style-btn" class="layout-style-btn" type="button" title="تغيير ترتيب الأزرار">
    <span>📐</span>
    <span id="layout-style-label">شبكة مزدوجة</span>
  </button>

  <div class="main-wrapper">
    <!-- 1. شريط التنبيهات والأخبار السريع -->
    <div id="announcement-bar" class="announcement-bar">
      <span class="announcement-badge">📢 جديد</span>
      <div class="announcement-ticker">
        <span id="announcement-text" class="announcement-text">✨ مرحباً بكم في دليل الأقسام والأرشيف | تم تحديث جميع الروابط والقنوات بنجاح!</span>
      </div>
    </div>

    function getSectionIcon(item) {

      }

      if (cat === "مجموعات") return ICONS_MAP.group;
      if (cat === "بوتات") return ICONS_MAP.bot;

    }

    // 2. طبقة جلب البيانات (DataService) لسهولة الربط مع API أو Firebase
    // =========================================================================
    const DataService = {
      async getSections() {
        if (CONFIG.apiEndpoint) {
          const response = await fetch(CONFIG.apiEndpoint);
          if (!response.ok) throw new Error("فشل تحميل البيانات");
          return await response.json();
        }
        return Promise.resolve(SECTIONS_DATA);
      }
    };

    // =========================================================================
    // 3. تكامل Telegram WebApp وفتح الروابط (قنوات / مجموعات / بوتات / حسابات)
    // =========================================================================
    const tg = (typeof window !== "undefined" && window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;

    function triggerHaptic() {
      try {
        if (tg && tg.HapticFeedback && typeof tg.HapticFeedback.impactOccurred === "function") {
          tg.HapticFeedback.impactOccurred("light");
        }
      } catch (_) {}
    }

    function openSectionTarget(url) {
      if (!url) return;
      triggerHaptic();

      // تحويل المعرفات المباشرة مثل @username إلى رابط تيليجرام كامل تلقائيًا
      let normalizedUrl = url.trim();
      if (normalizedUrl.startsWith("@")) {
        normalizedUrl = "https://t.me/" + normalizedUrl.slice(1);
      }

      const isTelegramUrl =
        normalizedUrl.startsWith("https://t.me/") ||
        normalizedUrl.startsWith("http://t.me/") ||
        normalizedUrl.startsWith("tg://");

      try {
        if (tg) {
          if (isTelegramUrl && typeof tg.openTelegramLink === "function") {
            tg.openTelegramLink(normalizedUrl);
            return;
          }
          if (typeof tg.openLink === "function") {
            tg.openLink(normalizedUrl);
            return;
          }
        }
      } catch (e) {
        console.warn("Fallback to window.open", e);
      }

      window.open(normalizedUrl, "_blank", "noopener,noreferrer");
    }

    // =========================================================================
    // 4. عرض الأقسام والفلترة ودعم الأقسام الفرعية (إن وجدت)
    // =========================================================================
    let allSections = [];
    let currentSubItems = null;
    let activeCategory = "الكل";
    let searchQuery = "";

    const sectionsColumn = document.getElementById("sections-column");
    const filterChipsEl = document.getElementById("filter-chips");
    const searchBoxEl = document.getElementById("search-box");
    const searchInputEl = document.getElementById("search-input");

    // نظام حفظ المفضلة في ذاكرة المتصفح (LocalStorage)
    function getFavorites() {
      try {
        return JSON.parse(localStorage.getItem("tg_blog_favorites") || "[]");
      } catch {
        return [];
      }
    }

    function toggleFavorite(id, event) {
      if (event) event.stopPropagation();
      triggerHaptic();
      let favs = getFavorites();
      const numId = Number(id);
      if (favs.includes(numId)) {
        favs = favs.filter(x => x !== numId);
      } else {
        favs.push(numId);
      }
      try {
        localStorage.setItem("tg_blog_favorites", JSON.stringify(favs));
      } catch {}
      renderSections();
      renderFilterChips();
    }

    function renderFilterChips() {
      if (!CONFIG.showHeaderControls || currentSubItems) {
        filterChipsEl.style.display = "none";
        searchBoxEl.style.display = "none";
        return;
      }

      filterChipsEl.style.display = "flex";
      searchBoxEl.style.display = "block";

      const favCount = getFavorites().length;
      const favLabel = favCount > 0 ? `⭐ المفضلة (${favCount})` : "⭐ المفضلة";
      const categories = ["الكل", favLabel, ...new Set(allSections.map(item => item.category).filter(Boolean))];

      filterChipsEl.innerHTML = categories
        .map(
          cat => `
          <button type="button" class="chip ${activeCategory === cat ? "active" : ""}" data-cat="${cat}">
            ${cat}
          </button>
        `
        )
        .join("");

      filterChipsEl.querySelectorAll(".chip").forEach(btn => {
        btn.addEventListener("click", () => {
          triggerHaptic();
          activeCategory = btn.dataset.cat;
          renderFilterChips();
          renderSections();
        });
      });
    }

    function renderSections() {
      const sourceList = currentSubItems || allSections;
      const q = searchQuery.trim().toLowerCase();
      const favs = getFavorites();
      const isFavTab = activeCategory.startsWith("⭐ المفضلة");

      const filtered = sourceList.filter(item => {
        let matchesCat = true;
        if (currentSubItems) {
          matchesCat = true;
        } else if (isFavTab) {
          matchesCat = favs.includes(Number(item.id));
        } else if (activeCategory !== "الكل") {
          matchesCat = item.category === activeCategory;
        }

        const fullTitle = `${item.title} ${item.numberOrSub || ""}`.toLowerCase();
        const matchesSearch = !q || fullTitle.includes(q);
        return matchesCat && matchesSearch;
      });

      if (filtered.length === 0) {
        const emptyText = isFavTab 
          ? "لم تقم بإضافة أي قسم إلى المفضلة بعد ⭐<br><small style='font-size: 0.8rem; color: #64748b;'>اضغط على رمز النجمة بأي قسم لحفظه هنا</small>" 
          : "لا توجد أقسام مطابقة للبحث 🔍";
        sectionsColumn.innerHTML = `<div class="empty-msg">${emptyText}</div>`;
        return;
      }

      sectionsColumn.innerHTML = filtered
        .map(
          (item, idx) => {
            const isFav = favs.includes(Number(item.id));
            const badgeHtml = item.badge && item.badgeText 
              ? `<span class="section-badge badge-${item.badge}">${item.badgeText}</span>` 
              : "";
            return `
            <div class="section-tile ${item.wide ? "wide-card-tile" : ""}" role="button" tabindex="0" data-index="${idx}">
              <button 
                type="button" 
                class="fav-star-btn ${isFav ? "is-fav" : ""}" 
                title="${isFav ? "إزالة من المفضلة" : "إضافة للمفضلة"}" 
                onclick="toggleFavorite(${item.id}, event)"
              >
                ${isFav ? "★" : "☆"}
              </button>
              ${badgeHtml}
              ${getSectionIcon(item)}
              <div class="tile-text-wrap">
                <div class="tile-title">${item.title}</div>
                ${item.numberOrSub ? `<div class="tile-subtitle">${item.numberOrSub}</div>` : ""}
              </div>
              <span class="tile-arrow">‹</span>
            </div>
          `;
          }
        )
        .join("");

      sectionsColumn.querySelectorAll(".section-tile").forEach(tile => {
        tile.addEventListener("click", () => {
          const item = filtered[Number(tile.dataset.index)];
          if (!item) return;

          if (Array.isArray(item.children) && item.children.length > 0) {
            triggerHaptic();
            currentSubItems = item.children;
            if (tg && tg.BackButton) tg.BackButton.show();
            renderFilterChips();
            renderSections();
            window.scrollTo({ top: 0, behavior: "smooth" });
          } else {
            openSectionTarget(item.url);
          }
        });
      });
    }

    function handleBackButton() {
      if (currentSubItems) {
        triggerHaptic();
        currentSubItems = null;
        if (tg && tg.BackButton) tg.BackButton.hide();
        renderFilterChips();
        renderSections();
      }
    }

    // =========================================================================
    // 5. خلفية فضائية فاخرة (سدم متوهجة + نجوم متلألئة + شهب ساقطة + 3 أنماط)
    // =========================================================================
    function initStarryBackground() {
      const canvas = document.getElementById("stars-canvas");
      const ctx = canvas.getContext("2d");

      const BG_THEMES = [
        {
          id: "galaxy",
          name: "المجرة الملكية",
          bgGradient: ["#0c1433", "#060919", "#020308"],
          nebulaColors: [
            "rgba(88, 101, 242, 0.13)",
            "rgba(168, 85, 247, 0.11)",
            "rgba(56, 189, 248, 0.09)"
          ],
          starPalette: ["#ffffff", "#e0f2fe", "#fde68a", "#c4b5fd", "#7dd3fc", "#fda4af"]
        },
        {
          id: "aurora",
          name: "الشفق الذهبي",
          bgGradient: ["#0f172a", "#071118", "#020409"],
          nebulaColors: [
            "rgba(245, 158, 11, 0.12)",
            "rgba(16, 185, 129, 0.10)",
            "rgba(99, 102, 241, 0.10)"
          ],
          starPalette: ["#ffffff", "#fde047", "#6ee7b7", "#fcd34d", "#a7f3d0"]
        },
        {
          id: "classic",
          name: "نجوم ملونة",
          bgGradient: ["#090a14", "#04040a", "#010103"],
          nebulaColors: [
            "rgba(255, 42, 75, 0.07)",
            "rgba(37, 232, 108, 0.06)",
            "rgba(123, 223, 242, 0.07)"
          ],
          starPalette: ["#ffffff", "#ff2a4b", "#25e86c", "#ffd166", "#ff7b54", "#7bdff2"]
        }
      ];

      let currentThemeIndex = 0;
      let stars = [];
      let nebulas = [];
      let shootingStars = [];

      function getTheme() {
        return BG_THEMES[currentThemeIndex];
      }

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        createScene();
      }

      function createScene() {
        const theme = getTheme();
        const count = Math.floor((canvas.width * canvas.height) / 1600);
        stars = [];

        for (let i = 0; i < count; i++) {
          const isBrightSparkle = Math.random() < 0.1;
          stars.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            r: isBrightSparkle ? Math.random() * 2.1 + 1.3 : Math.random() * 1.3 + 0.35,
            color: theme.starPalette[Math.floor(Math.random() * theme.starPalette.length)],
            alpha: Math.random() * 0.85 + 0.15,
            speed: (Math.random() * 0.014 + 0.003) * (Math.random() < 0.5 ? 1 : -1),
            driftY: -(Math.random() * 0.12 + 0.02),
            sparkle: isBrightSparkle
          });
        }

        // سحب سديمية ناعمة تتحرك ببطء في الخلفية
        nebulas = theme.nebulaColors.map((color, idx) => ({
          x: (canvas.width / 3) * idx + canvas.width * 0.2,
          y: (canvas.height / 3) * idx + canvas.height * 0.18,
          radius: Math.max(canvas.width, canvas.height) * (0.38 + idx * 0.06),
          color,
          vx: (Math.random() * 0.25 + 0.08) * (idx % 2 === 0 ? 1 : -1),
          vy: (Math.random() * 0.2 + 0.06) * (idx % 2 === 0 ? -1 : 1)
        }));
      }

      function spawnShootingStar() {
        if (shootingStars.length >= 2) return;
        const startX = Math.random() * canvas.width * 0.85 + canvas.width * 0.1;
        const startY = Math.random() * canvas.height * 0.45;
        const angle = (Math.PI / 4) + (Math.random() * 0.2 - 0.1);
        const speed = Math.random() * 6 + 7;

        shootingStars.push({
          x: startX,
          y: startY,
          vx: -Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          len: Math.random() * 75 + 55,
          alpha: 1
        });
      }

      function draw() {
        const theme = getTheme();

        // 1. تدرج الفضاء العميق
        const bgGrad = ctx.createRadialGradient(
          canvas.width * 0.5,
          canvas.height * 0.2,
          10,
          canvas.width * 0.5,
          canvas.height * 0.5,
          Math.max(canvas.width, canvas.height)
        );
        bgGrad.addColorStop(0, theme.bgGradient[0]);
        bgGrad.addColorStop(0.55, theme.bgGradient[1]);
        bgGrad.addColorStop(1, theme.bgGradient[2]);
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // 2. رسم السدم الفضائية المضيئة
        for (const n of nebulas) {
          n.x += n.vx;
          n.y += n.vy;
          if (n.x < -100 || n.x > canvas.width + 100) n.vx *= -1;
          if (n.y < -100 || n.y > canvas.height + 100) n.vy *= -1;

          const nebGrad = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.radius);
          nebGrad.addColorStop(0, n.color);
          nebGrad.addColorStop(1, "rgba(0, 0, 0, 0)");
          ctx.fillStyle = nebGrad;
          ctx.beginPath();
          ctx.arc(n.x, n.y, n.radius, 0, Math.PI * 2);
          ctx.fill();
        }

        // 3. رسم النجوم المتلألئة وحركتها الانسيابية
        for (const s of stars) {
          s.alpha += s.speed;
          if (s.alpha >= 1) {
            s.alpha = 1;
            s.speed = -s.speed;
          } else if (s.alpha <= 0.15) {
            s.alpha = 0.15;
            s.speed = -s.speed;
          }

          s.y += s.driftY;
          if (s.y < -4) {
            s.y = canvas.height + 4;
            s.x = Math.random() * canvas.width;
          }

          ctx.save();
          ctx.globalAlpha = s.alpha;
          ctx.fillStyle = s.color;
          ctx.shadowBlur = s.sparkle ? 12 : 4;
          ctx.shadowColor = s.color;

          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
          ctx.fill();

          if (s.sparkle) {
            ctx.strokeStyle = s.color;
            ctx.lineWidth = 0.85;
            const len = s.r * 4.2;
            ctx.beginPath();
            ctx.moveTo(s.x - len, s.y);
            ctx.lineTo(s.x + len, s.y);
            ctx.moveTo(s.x, s.y - len);
            ctx.lineTo(s.x, s.y + len);
            ctx.stroke();
          }

          ctx.restore();
        }

        // 4. رسم الشهب الساقطة (Shooting Stars)
        if (Math.random() < 0.012) {
          spawnShootingStar();
        }

        for (let i = shootingStars.length - 1; i >= 0; i--) {
          const sh = shootingStars[i];
          sh.x += sh.vx;
          sh.y += sh.vy;
          sh.alpha -= 0.016;

          if (sh.alpha <= 0 || sh.x < -100 || sh.y > canvas.height + 100) {
            shootingStars.splice(i, 1);
            continue;
          }

          const tailX = sh.x - (sh.vx / Math.hypot(sh.vx, sh.vy)) * sh.len;
          const tailY = sh.y - (sh.vy / Math.hypot(sh.vx, sh.vy)) * sh.len;

          ctx.save();
          const tailGrad = ctx.createLinearGradient(sh.x, sh.y, tailX, tailY);
          tailGrad.addColorStop(0, `rgba(255, 255, 255, ${sh.alpha})`);
          tailGrad.addColorStop(0.3, `rgba(253, 230, 138, ${sh.alpha * 0.7})`);
          tailGrad.addColorStop(1, "rgba(255, 255, 255, 0)");

          ctx.strokeStyle = tailGrad;
          ctx.lineWidth = 2;
          ctx.lineCap = "round";
          ctx.beginPath();
          ctx.moveTo(sh.x, sh.y);
          ctx.lineTo(tailX, tailY);
          ctx.stroke();

          // رأس الشهاب اللامع
          ctx.fillStyle = `rgba(255, 255, 255, ${sh.alpha})`;
          ctx.shadowBlur = 10;
          ctx.shadowColor = "#fde68a";
          ctx.beginPath();
          ctx.arc(sh.x, sh.y, 1.8, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        requestAnimationFrame(draw);
      }

      // تبديل ثيم الخلفية عند الضغط على زر الزاوية
      const bgBtn = document.getElementById("bg-style-btn");
      const bgLabel = document.getElementById("bg-style-label");
      if (bgBtn && bgLabel) {
        bgBtn.addEventListener("click", () => {
          triggerHaptic();
          currentThemeIndex = (currentThemeIndex + 1) % BG_THEMES.length;
          bgLabel.textContent = getTheme().name;
          createScene();
          spawnShootingStar();
        });
      }

      window.addEventListener("resize", resize);
      resize();
      setTimeout(spawnShootingStar, 800);
      draw();
    }

    // =========================================================================
    // 6. التهيئة العامة وزر الصعود للأعلى
    // =========================================================================
    async function initApp() {
      try {
        if (tg) {
          if (typeof tg.ready === "function") tg.ready();
          if (typeof tg.expand === "function") tg.expand();
          if (typeof tg.setHeaderColor === "function") tg.setHeaderColor("#17212b");
          if (typeof tg.setBackgroundColor === "function") tg.setBackgroundColor("#020205");
          if (tg.BackButton && typeof tg.BackButton.onClick === "function") {
            tg.BackButton.onClick(handleBackButton);
          }
        }
      } catch (err) {
        console.warn("Telegram WebApp initialization error:", err);
      }

      try {
        const user = tg?.initDataUnsafe?.user;
        const greetingEl = document.getElementById("user-greeting");
        if (CONFIG.showHeaderControls && user && (user.first_name || user.username)) {
          const name = [user.first_name, user.last_name].filter(Boolean).join(" ") || user.username;
          greetingEl.textContent = `أهلاً بك يا ${name} ✨`;
        } else {
          greetingEl.style.display = "none";
        }
      } catch (e) {
        console.warn("User greeting error:", e);
      }

      try {
        // ضبط شريط الإعلانات والتنبيهات
        const announcementBar = document.getElementById("announcement-bar");
        const announcementTextEl = document.getElementById("announcement-text");
        if (CONFIG.showAnnouncement && CONFIG.announcementText) {
          announcementTextEl.textContent = CONFIG.announcementText;
          announcementBar.style.display = "flex";
        } else {
          announcementBar.style.display = "none";
        }

        const footerEl = document.getElementById("bot-footer");
        footerEl.textContent = CONFIG.botUsername;
        footerEl.addEventListener("click", () => openSectionTarget(CONFIG.botUrl));

        searchInputEl.addEventListener("input", e => {
          searchQuery = e.target.value;
          renderSections();
        });

        const scrollTopBtn = document.getElementById("scroll-top-btn");
        window.addEventListener("scroll", () => {
          if (window.scrollY > 120) {
            scrollTopBtn.classList.add("visible");
          } else {
            scrollTopBtn.classList.remove("visible");
          }
        });

        scrollTopBtn.addEventListener("click", () => {
          triggerHaptic();
          window.scrollTo({ top: 0, behavior: "smooth" });
        });

        // أنماط ترتيب الأزرار والتبديل الفوري بينها
        const LAYOUT_MODES = [
          { id: "hybrid", name: "شبكة + بطاقات", className: "layout-hybrid" },
          { id: "grid-2", name: "شبكة مزدوجة", className: "layout-grid-2" },
          { id: "cards", name: "بطاقات عريضة", className: "layout-cards" },
          { id: "column", name: "عمود كلاسيكي", className: "" }
        ];

        let currentLayoutIndex = Math.max(
          0,
          LAYOUT_MODES.findIndex(m => m.id === CONFIG.defaultLayout)
        );

        const layoutBtn = document.getElementById("layout-style-btn");
        const layoutLabel = document.getElementById("layout-style-label");

        function applyLayoutMode() {
          const mode = LAYOUT_MODES[currentLayoutIndex];
          sectionsColumn.classList.remove("layout-hybrid", "layout-grid-2", "layout-cards", "layout-zigzag");
          if (mode.className) {
            sectionsColumn.classList.add(mode.className);
          }
          if (layoutLabel) {
            layoutLabel.textContent = mode.name;
          }
        }

        if (layoutBtn) {
          layoutBtn.addEventListener("click", () => {
            triggerHaptic();
            currentLayoutIndex = (currentLayoutIndex + 1) % LAYOUT_MODES.length;
            applyLayoutMode();
          });
        }

        // التحكم بزر إخفاء/إظهار أدوات البحث والتصنيفات (الميزة رقم 4)
        const toggleHeaderBtn = document.getElementById("toggle-header-btn");
        const topBarEl = document.getElementById("top-bar");
        const toggleHeaderIcon = document.getElementById("toggle-header-icon");
        const toggleHeaderText = document.getElementById("toggle-header-text");
        let isHeaderVisible = true;

        if (toggleHeaderBtn && topBarEl) {
          toggleHeaderBtn.addEventListener("click", () => {
            triggerHaptic();
            isHeaderVisible = !isHeaderVisible;
            if (isHeaderVisible) {
              topBarEl.style.display = "block";
              toggleHeaderIcon.textContent = "🔽";
              toggleHeaderText.textContent = "إخفاء أدوات البحث والفلترة";
            } else {
              topBarEl.style.display = "none";
              toggleHeaderIcon.textContent = "🔍";
              toggleHeaderText.textContent = "إظهار أدوات البحث والفلترة";
            }
          });
        }

        applyLayoutMode();
      } catch (e) {
        console.warn("UI setup error:", e);
      }

      try {
        initStarryBackground();
      } catch (e) {
        console.warn("Background canvas error:", e);
      }

      try {
        allSections = await DataService.getSections();
        renderFilterChips();
        renderSections();
      } catch (e) {
        console.error("Sections rendering error:", e);
      }

      // إخفاء شاشة التحميل الافتتاحية بعد اكتمال الصفحة (الميزة رقم 3)
      setTimeout(() => {
        const splash = document.getElementById("splash-screen");
        if (splash) {
          splash.classList.add("fade-out");
        }
      }, 450);
    }

    // التبديل بين العملات في خانة التبرع المدمجة
    let currentCrypto = "ton";
    function switchCryptoTab(coin) {
      triggerHaptic();
      currentCrypto = coin;
      document.querySelectorAll(".crypto-tab-btn").forEach(btn => btn.classList.remove("active"));
      event.target.classList.add("active");
      const targetAddr = document.getElementById("addr-" + coin)?.innerText || "";
      document.getElementById("active-crypto-address").innerText = targetAddr;
    }

    // دالة نسخ المحفظة المعروضة حالياً
    function copyCurrentAddress() {
      const address = document.getElementById("active-crypto-address")?.innerText;
      if (!address || address.includes("ضع_عنوان_محفظة")) return;
      navigator.clipboard.writeText(address).then(() => {
        triggerHaptic();
        alert("تم نسخ عنوان المحفظة بنجاح! شكراً لدعمك ❤️");
      }).catch(() => {});
    }

    initApp();
  </script>
